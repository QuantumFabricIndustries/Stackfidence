[package]
name = "stackfidence"
version = "0.1.0"
edition = "2021"
authors = ["pleggtheking <pleggtheking@users.noreply.github.com>"]
description = "The 8-layer agent execution substrate. Build AI agent systems you can actually trust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/pleggtheking/stackfidence"
homepage = "https://github.com/pleggtheking/stackfidence"
documentation = "https://docs.rs/stackfidence"
readme = "README.md"
keywords = ["agents", "ai", "runtime", "trust", "llm"]
categories = ["asynchronous", "concurrency", "science"]

[features]
default = []
llm = []

[[bin]]
name = "stackfidence"
path = "src/bin/agentstack.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "framework"
path = "benches/framework.rs"
harness = false
